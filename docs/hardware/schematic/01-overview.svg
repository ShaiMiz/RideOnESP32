<text x="1190" y="661" font-size="12.0" text-anchor="start" font-weight="bold" fill="#212121">Stock plugs</text>
<text x="1190" y="677" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">Every plug on the box edge (J1–J8) is a mating</text>
<text x="1190" y="693" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">connector for a stock plug, so the box swaps</text>
<text x="1190" y="709" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">with the HY2005RX controller one-for-one.</text>
<text x="1190" y="725" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">Connector types and pin counts: TBD from</text>
<text x="1190" y="741" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">the photos of the stock controller.</text>
<rect x="40" y="800" width="700" height="128" rx="6" fill="#f1f5f9" stroke="#90a4ae" stroke-width="1.2"/>
<text x="50" y="821" font-size="12.0" text-anchor="start" font-weight="bold" fill="#212121">Going back to stock</text>
<text x="50" y="837" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">1. Key off. Unplug J1–J8 from the new box.</text>
<text x="50" y="853" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">2. Plug the same stock plugs into the HY2005RX controller.</text>
<text x="50" y="869" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">3. If the stock harness joins the motors in pairs: the new box has its own</text>
<text x="50" y="885" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">   4-lead motor cable (J6, J7). Unplug each motor from it and plug it back</text>
<text x="50" y="901" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">   into its stock harness branch. Nothing is cut or spliced.</text>
<text x="50" y="917" font-size="11.5" text-anchor="start" font-weight="normal" fill="#212121">4. Unplug the E-stop and sensors (J9–J11); the stock car has none.</text>
<rect x="800" y="800" width="760" height="190" rx="6" fill="#f1f5f9" stroke="#90a4ae" stroke-width="1.2"/>
