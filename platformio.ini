; RideOnESP32 v3 - PlatformIO project
;
;   pio run -e car            the car firmware (src/main.cpp)
;   pio run -e radio_check    phase 2 bench firmware: radio link and channels only
;   pio run -e one_motor      phase 4 bench firmware: one motor on the front-left driver
;   pio test -e native        safety logic unit tests, runs on the PC
;
; Arduino core 3.x comes from the pioarduino platform; the official PlatformIO
; espressif32 platform does not support it.

[platformio]
default_envs = car

[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0
; Our own code (src/, and lib/rideon_core via its library.json) must build
; without a warning; the Arduino core and libraries are not ours to fix.
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Werror=unused-variable
    -Werror=unused-but-set-variable
    -Werror=unused-function
lib_deps =
    ; pinned commit: getChannel() is 1-based, isLinkUp() drops after 300 ms
    https://github.com/AlfredoSystems/AlfredoCRSF.git#208899c2f8bd1ef163335a04d793870a469fa36f

[env:car]
extends = esp32_common
build_src_filter = +<*> -<bench/>

[env:radio_check]
extends = esp32_common
build_src_filter = +<bench/radio_check.cpp> +<input/RadioInput.cpp> +<safety/KillLines.cpp>

[env:one_motor]
extends = esp32_common
build_src_filter =
    +<bench/one_motor.cpp>
    +<input/RadioInput.cpp>
    +<safety/KillLines.cpp>
    +<safety/Watchdog.cpp>
    +<drive/BTS7960Motor.cpp>
    +<sensing/PowerMonitor.cpp>
    +<telemetry/Log.cpp>

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
