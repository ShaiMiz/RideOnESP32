name: build

on:
  push:
  pull_request:

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin map, PINOUT.md and WIRING.md agree
        run: python3 tools/check_pin_docs.py
      - name: KiCad schematic and tables are generated from the current design and pins.h
        run: |
          python3 docs/hardware/kicad/gen/generate.py
          git diff --exit-code -- docs/hardware/kicad

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Safety logic and pin map unit tests
        run: pio test -e native

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [car, radio_check, one_motor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

  exploded-view:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/exploded-view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/exploded-view/package-lock.json
      - run: npm ci
      - name: Every BOM ref is drawn and every wire joins two parts
        run: npm test
      - name: Build the 3D exploded view
        run: npm run build
