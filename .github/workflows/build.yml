name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pin map, PINOUT.md and WIRING.md agree
        run: python3 tools/check_pin_docs.py
      - name: LOG_EVENTS.md lists every log event, part and symptom the firmware prints
        run: python3 tools/check_log_events.py
      - name: Every requirement in VERIFICATION.md has a test or gate, and every test runs
        run: python3 tools/check_verification.py
      - name: KiCad schematic and tables are generated from the current design and pins.h
        run: |
          python3 docs/hardware/kicad/gen/generate.py
          git diff --exit-code -- docs/hardware/kicad

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Safety logic and pin map unit tests
        run: pio test -e native

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          pip install gcovr
      - name: Every test suite with -Werror, AddressSanitizer and UndefinedBehaviorSanitizer
        run: tools/run_native_tests.sh
      - name: Coverage floors (lib/rideon_core, safety files fully covered)
        run: python3 tools/check_coverage.py
      - name: Static analysis (cppcheck)
        run: tools/run_cppcheck.sh
      - name: Mutation check (the tests catch deliberate safety bugs)
        run: python3 tools/mutation_check.py

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [car, radio_check, one_motor, bt_setup]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

  exploded-view:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/exploded-view
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/exploded-view/package-lock.json
      - name: project.json is generated from the current BOM, wire list and design.py
        run: python3 scripts/build_data.py --check
      - run: npm ci
      - name: Every BOM ref is drawn and every wire joins two parts
        run: npm test
      - name: Build the 3D exploded view
        run: npm run build
